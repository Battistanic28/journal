name: Deploy to GitHub Pages

on:
  # Workflow is triggered upon merge to `main` branch
  push:
    branches: [main]
  # Allow manually triggered workflow via Actions tab on GitHub.
  workflow_dispatch:
  # Refresh the feed data and redeploy twice a day. Cron is in UTC.
  schedule:
    - cron: '17 */12 * * *'

# Allow this job to clone the repo, commit refreshed feed data, and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run feed script
        run: bun run lib/getFeed.ts
      - name: Commit updated feed data
        run: |
          if ! git diff --exit-code src/content/config/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/config/data.json
            git commit -m "chore: refresh feed data"
            git push
          fi

  build:
    needs: refresh-feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
        # with:
            # path: . # The root location of your Astro project inside the repository. (optional)
            # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
            # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
            # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
            # out-dir: dist # The output directory created by the build command. Defaults to dist. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4