name: Deploy to GitHub Pages

on:
  # Workflow is triggered upon merge to `main` branch
  push:
    branches: [main]
  # Allow manually triggered workflow via Actions tab on GitHub.
  workflow_dispatch:
  # Refresh the feed data and redeploy twice a day. Cron is in UTC.
  schedule:
    - cron: '17 */12 * * *'

# Allow this job to upload the built site and create a page deployment.
# (No `contents: write` — feed data is regenerated at build time, not committed.)
permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Refresh feed data
        run: bun run lib/getFeed.ts
      - name: Install, build, and upload your site output
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
